name: Skill validation
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - FIX-FIRST.md
      - LASTUPDATE.md
      - TEST-EVIDENCE.md
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    name: Portable checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -B tests/run_validation.py --scope portable --output validation-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: portable-${{ matrix.os }}
          path: validation-results
  macos-regression:
    name: Native macOS arm64 regression
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'
      - name: Prepare test prerequisites
        run: |
          echo "V2E_READER_MATRIX_DIR=$RUNNER_TEMP/v2e-reader-matrix" >> "$GITHUB_ENV"
          test "$(uname -m)" = arm64
          /Library/Developer/CommandLineTools/usr/bin/python3 --version
          node --version
          cc --version
          command -v pdftotext || brew install poppler
      - name: Check portable behavior with the release interpreter
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -B tests/run_validation.py --scope portable --output macos-preflight-results
      - name: Prepare pinned Chromium headless shell
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v2e-playwright-1.64.0
          npm_config_cache: ${{ runner.temp }}/v2e-npm-cache
        run: |
          # CI preparation only; Playwright 1.64.0 pins headless-shell revision 1248.
          npm exec --yes --package=playwright@1.64.0 -- playwright install --only-shell chromium
          browser="$PLAYWRIGHT_BROWSERS_PATH/chromium_headless_shell-1248/chrome-headless-shell-mac-arm64/chrome-headless-shell"
          test -x "$browser"
          "$browser" --version
          echo "V2E_BROWSER=$browser" >> "$GITHUB_ENV"
      - name: Prepare pinned and hash-verified readers
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -B tests/reader_matrix_prepare.py "$V2E_READER_MATRIX_DIR"
      - name: Run complete regression with mandatory readers
        run: /Library/Developer/CommandLineTools/usr/bin/python3 -B tests/run_validation.py --scope macos --output validation-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-native-regression
          path: |
            validation-results
            macos-preflight-results
